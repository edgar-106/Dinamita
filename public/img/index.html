<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animación de Desplazamiento Fluido</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000;
            height: 400vh; /* Permite hacer scroll para ver la animación */
            overflow-x: hidden;
            scrollbar-width: none; /* Oculta scrollbar en Firefox */
        }
        body::-webkit-scrollbar {
            display: none; /* Oculta scrollbar en Chrome/Safari */
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* Asegura que cubra toda la pantalla limpiamente */
        }
    </style>
</head>
<body>
    <canvas id="animationCanvas"></canvas>

    <script>
        const canvas = document.getElementById('animationCanvas');
        const context = canvas.getContext('2d');
        const frameCount = 300;
        
        // Ajustar el tamaño del canvas al tamaño de la ventana
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const currentFrame = index => (
            `./ezgif-frame-${(index + 1).toString().padStart(3, '0')}.jpg`
        );

        const images = [];
        
        // Precargar imágenes para mayor fluidez
        for (let i = 0; i < frameCount; i++) {
            const img = new Image();
            img.src = currentFrame(i);
            images.push(img);
        }

        const drawImageCentered = (img) => {
            const canvasRatio = canvas.width / canvas.height;
            const imgRatio = img.width / img.height;
            let renderWidth, renderHeight, x, y;

            if (canvasRatio > imgRatio) {
                renderWidth = canvas.width;
                renderHeight = canvas.width / imgRatio;
                x = 0;
                y = (canvas.height - renderHeight) / 2;
            } else {
                renderWidth = canvas.height * imgRatio;
                renderHeight = canvas.height;
                x = (canvas.width - renderWidth) / 2;
                y = 0;
            }

            context.clearRect(0, 0, canvas.width, canvas.height);
            context.drawImage(img, x, y, renderWidth, renderHeight);
        };

        // Renderizar la primera imagen una vez que cargue
        images[0].onload = () => {
            drawImageCentered(images[0]);
        };

        let currentProgress = 0;

        const updateFrameFromProgress = (progress) => {
            currentProgress = Math.max(0, Math.min(1, progress));
            const frameIndex = Math.min(
                frameCount - 1,
                Math.floor(currentProgress * frameCount)
            );
            requestAnimationFrame(() => {
                if (images[frameIndex] && images[frameIndex].complete) {
                    drawImageCentered(images[frameIndex]);
                }
            });
        };

        window.addEventListener('scroll', () => {
            const scrollTop = document.documentElement.scrollTop;
            const maxScrollTop = document.documentElement.scrollHeight - window.innerHeight;
            const scrollFraction = maxScrollTop > 0 ? scrollTop / maxScrollTop : 0;
            updateFrameFromProgress(scrollFraction);
        });

        // Soporte de rueda de mouse dentro de iframe
        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            const maxScrollTop = document.documentElement.scrollHeight - window.innerHeight;
            if (maxScrollTop > 0) {
                window.scrollBy({ top: e.deltaY, behavior: 'auto' });
            } else {
                currentProgress += e.deltaY * 0.001;
                updateFrameFromProgress(currentProgress);
            }
        }, { passive: false });

        // Soporte táctil en dispositivos móviles
        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                const deltaY = touchStartY - e.touches[0].clientY;
                touchStartY = e.touches[0].clientY;
                window.scrollBy({ top: deltaY, behavior: 'auto' });
            }
        }, { passive: true });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const scrollTop = document.documentElement.scrollTop;
            const maxScrollTop = document.documentElement.scrollHeight - window.innerHeight;
            const scrollFraction = maxScrollTop > 0 ? scrollTop / maxScrollTop : currentProgress;
            updateFrameFromProgress(scrollFraction);
        });
    </script>
</body>
</html>
